# Split metadata for openml_tabular (benchmark plan §2).
#
# This file records ONLY checkable facts: each task's FAMILY (benchmark ×
# modality — the stratification unit) and exclusions with reasons. Role
# assignment (bank / val / test) is NEVER stored here: it is computed
# deterministically by arbench.assign_roles(fractions, seed) from the
# human-defined percentages — the fractions live in the experiment config
# (a hashed confound), so no run can happen before the human sets them.
#
# Notes are measured observations from the 2026-07-08 gates sweep, recorded
# for analysis; they do not affect the draw.
benchmark: openml_tabular
tasks:
  MagicTelescope:  {family: tabular, kind: classification}
  MiniBooNE:       {family: tabular, kind: classification,
                    note: "near-ceiling at baseline (0.985) — check vs oracle"}
