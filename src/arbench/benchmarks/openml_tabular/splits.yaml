# Split metadata for openml_tabular (benchmark plan §2).
#
# This file records ONLY checkable facts: each task's FAMILY (benchmark ×
# modality — the stratification unit) and exclusions with reasons. Role
# assignment (bank / val / test) is NEVER stored here: it is computed
# deterministically by arbench.assign_roles(fractions, seed) from the
# human-defined percentages — the fractions live in the experiment config
# (a hashed confound), so no run can happen before the human sets them.
#
# Notes are measured observations from the 2026-07-08 gates sweep, recorded
# for analysis; they do not affect the draw.#
# `published` = when the task's DATA first became public (origin, not the
# 2022 OpenML re-upload date) — the contamination axis: pre/post model-cutoff
# comparisons read this field. Every current task is pre-2023; post-cutoff
# tasks must be sourced deliberately.
benchmark: openml_tabular
tasks:
  MagicTelescope:  {published: "2004", family: tabular, kind: classification}
  MiniBooNE:       {published: "2005", family: tabular, kind: classification,
                    note: "near-ceiling at baseline (0.985) — check vs oracle"}
  bank-marketing:  {published: "2012", family: tabular, kind: classification}
  cpu_activity:    {published: "1996", family: tabular, kind: regression}
  credit:          {published: "2011", family: tabular, kind: classification}
  electricity:     {published: "1999", family: tabular, kind: classification,
                    note: "temporal; random CV leaks (baseline proxy 0.996 vs heldout 0.879)"}
  wine_quality:    {published: "2009", family: tabular, kind: regression}
  covertype:       {published: "1998", family: tabular, kind: classification,
                    note: "near-ceiling at baseline (0.970)"}
  house_16H:       {published: "1996", family: tabular, kind: classification}
  superconduct:    {published: "2018", family: tabular, kind: regression}
  pol:             {published: "1995", family: tabular, kind: classification,
                    note: "SATURATED at baseline (heldout 0.9997, gates 2026-07-08) — in the draw, but exclude from effect readouts"}
