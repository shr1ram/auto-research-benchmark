# Task splits for openml_tabular — the IN-DOMAIN benchmark (distance ladder
# L0/L1). Distance is benchmark-relational by design (2026-07-08): no semantic
# task families.
#
# EVERY assignment is `unassigned` until the human explicitly signs off —
# nothing runs on an unassigned bin (split: refs resolve empty and configs
# refuse empty task lists). The 2026-07-08 PROPOSAL is in the per-line
# comments: in_domain source/eval is a seeded random 7/3 draw
# (random.Random(0), stratified so eval holds both classification and
# regression); pol is proposed as control on measured saturation (baseline
# heldout 0.9997, gates sweep 2026-07-08).
#
# bins (once assigned):
#   in_domain_source  memory-source tasks: their traces build the banks
#   in_domain_eval    held-out eval tasks of the SAME benchmark
#   control           measured-saturated at baseline; null-effect check only
benchmark: openml_tabular
splits:
  MagicTelescope:  {modality: unassigned, bin: unassigned}  # proposed: tabular / in_domain_source (classification)
  MiniBooNE:       {modality: unassigned, bin: unassigned}  # proposed: tabular / in_domain_source (classification; near-ceiling 0.985 — check vs oracle)
  bank-marketing:  {modality: unassigned, bin: unassigned}  # proposed: tabular / in_domain_source (classification)
  cpu_activity:    {modality: unassigned, bin: unassigned}  # proposed: tabular / in_domain_source (regression)
  credit:          {modality: unassigned, bin: unassigned}  # proposed: tabular / in_domain_source (classification)
  electricity:     {modality: unassigned, bin: unassigned}  # proposed: tabular / in_domain_source (classification; temporal — random CV leaks: proxy 0.996 vs heldout 0.879)
  wine_quality:    {modality: unassigned, bin: unassigned}  # proposed: tabular / in_domain_source (regression)
  covertype:       {modality: unassigned, bin: unassigned}  # proposed: tabular / in_domain_eval (classification; near-ceiling 0.970)
  house_16H:       {modality: unassigned, bin: unassigned}  # proposed: tabular / in_domain_eval (classification)
  superconduct:    {modality: unassigned, bin: unassigned}  # proposed: tabular / in_domain_eval (regression)
  pol:             {modality: unassigned, bin: unassigned}  # proposed: tabular / control (saturated: baseline heldout 0.9997)
