[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-research-benchmark"
version = "0.2.0"
description = "Benchmark tasks + held-out grading as a library (ALE-Bench, OpenML tabular). Nothing here drives an agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shriram" }]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1",
    # grading is core arbench functionality (the openml grader)
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# ALE-Bench preparation (scripts/prepare_ale_bench.py): the dataset is
# Xet-backed, so hf_hub_download is required to fetch problem zips.
ale-prep = ["huggingface_hub>=0.20"]
# OPTIONAL one-off cross-check of our self-contained ale_bench grader
# against Sakana's official Docker judge (any Docker host; never on a
# pipeline path):  uv sync --extra ale-crosscheck
ale-crosscheck = ["ale-bench @ git+https://github.com/SakanaAI/ALE-Bench.git@8ae5b832227e50729f7673f248565c319c301264"]
dev = ["pytest>=7.0", "pytest-timeout>=2.0"]

[project.scripts]
arbench = "arbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"arbench.benchmarks.openml_tabular" = ["splits.yaml"]
"arbench.benchmarks.ale_bench" = ["splits.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
