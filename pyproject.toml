[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-research-benchmark"
version = "0.2.0"
description = "Benchmark tasks + held-out grading as a library (MLE-Bench Lite, OpenML tabular). Nothing here drives an agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shriram" }]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1",
    # grading is core arbench functionality (openml + mlebench graders)
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# Pulled in only when actually running the MLE-bench benchmark on a box:
#   uv sync --extra mlebench   (editable path dep on vendor/mle-bench, see
#   [tool.uv.sources]; the checkout itself is gitignored — vendor/README.md)
mlebench = ["mlebench"]
# OPTIONAL one-off cross-check of our self-contained ale_bench grader
# against Sakana's official Docker judge (any Docker host; never on a
# pipeline path):  uv sync --extra ale-crosscheck
ale-crosscheck = ["ale-bench @ git+https://github.com/SakanaAI/ALE-Bench.git@8ae5b832227e50729f7673f248565c319c301264"]
dev = ["pytest>=7.0", "pytest-timeout>=2.0"]

[project.scripts]
arbench = "arbench.cli:main"

[tool.uv.sources]
mlebench = { path = "vendor/mle-bench", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"arbench.benchmarks.openml_tabular" = ["splits.yaml"]
"arbench.benchmarks.mlebench_lite" = ["splits.yaml"]
"arbench.benchmarks.ale_bench" = ["splits.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
